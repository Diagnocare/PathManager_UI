# ──────────────────────────────────────────────────────────────────────────────
# nginx: serve the Angular SPA and reverse-proxy the API.
#
# If the app is built with apiBaseUrl = "/api", the browser talks only to THIS
# origin (same-origin, no CORS preflights) and nginx forwards /api to the API
# container server-side. Rename the upstream target if your compose service name
# for the API differs from "api".
# ──────────────────────────────────────────────────────────────────────────────

# The API service hostname on the docker network (compose service name).
upstream pathmanager_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache index — it references the hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed static assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://pathmanager_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── SPA fallback: every other path returns index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
